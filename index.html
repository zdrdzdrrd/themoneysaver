<title>Mis finanzas</title>

<style>
  :root{
    --paper:#E9EFED; --card:#FFFFFF; --ink:#0F1620; --ink-soft:#54606D; --ink-faint:#88929F;
    --line:#E3E9E7; --field:#F3F8F6;
    --accent:#0E9E86; --accent-12:rgba(14,158,134,.12); --accent-22:rgba(14,158,134,.22);
    --grad:linear-gradient(135deg,#10B981 0%,#0EA5A5 52%,#0891B2 100%);
    --grad-text:linear-gradient(135deg,#0E9F8A 0%,#0C8FA6 100%);
    --warn:#C2861F; --warn-14:rgba(194,134,31,.16);
    --danger:#C0492F; --danger-12:rgba(192,73,47,.12);
    --shadow:0 1px 2px rgba(16,32,40,.05),0 12px 32px rgba(16,40,48,.07);
    --glow:0 0 0 rgba(0,0,0,0);
    --hero-aurora:radial-gradient(120% 140% at 0% -10%, rgba(16,185,129,.10), transparent 55%), radial-gradient(120% 140% at 100% 0%, rgba(8,145,178,.10), transparent 55%);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#070B11; --card:#111A24; --ink:#E9F1F6; --ink-soft:#9AA8B6; --ink-faint:#5E6C7A;
      --line:#1E2A37; --field:#0D151D;
      --accent:#2DD4BF; --accent-12:rgba(45,212,191,.15); --accent-22:rgba(45,212,191,.30);
      --grad:linear-gradient(135deg,#34D399 0%,#22D3D6 52%,#38BDF8 100%);
      --grad-text:linear-gradient(135deg,#34D399 0%,#22D3EE 58%,#38BDF8 100%);
      --warn:#E6B14A; --warn-14:rgba(230,177,74,.20);
      --danger:#F0795C; --danger-12:rgba(240,121,92,.20);
      --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 42px rgba(0,0,0,.55);
      --glow:0 0 26px rgba(45,212,191,.30);
      --hero-aurora:radial-gradient(130% 150% at 0% -15%, rgba(52,211,153,.20), transparent 56%), radial-gradient(130% 150% at 112% 0%, rgba(56,189,248,.17), transparent 56%);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45;min-height:100vh;}
  .num{font-family:'Space Grotesk','Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .wrap{max-width:680px;margin:0 auto;padding:max(20px, calc(env(safe-area-inset-top, 0px) + 12px)) max(18px, env(safe-area-inset-right, 0px)) calc(76px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));}

  /* Header + tabs */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-12);}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0;}
  .tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .tabs button{appearance:none;border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer;transition:all .15s;}
  .tabs button.on{background:var(--accent);color:#fff;}

  .ctrl-row{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:12px;}
  .monthnav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .monthnav button{appearance:none;border:0;background:transparent;color:var(--ink-soft);width:30px;height:30px;border-radius:999px;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
  .monthnav button:hover:not(:disabled){background:var(--accent-12);color:var(--accent);}
  .monthnav button:disabled{opacity:.35;cursor:default;}
  .monthnav .label{font-size:13px;font-weight:600;min-width:104px;text-align:center;text-transform:capitalize;}
  .pwrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .pselect{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);cursor:pointer;}

  /* Hero */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 18px;box-shadow:var(--shadow);margin-bottom:12px;}
  .hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .hero .total{font-family:'Space Grotesk',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;font-size:clamp(34px,9vw,46px);line-height:1.04;letter-spacing:-.02em;}
  .delta{margin-top:6px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;}
  .delta.up{color:var(--danger);} .delta.down{color:var(--accent);} .delta.flat{color:var(--ink-faint);}
  .hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .hchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:11px;background:var(--field);border:1px solid var(--line);}
  .hchip .k{color:var(--ink-faint);} .hchip .v{color:var(--ink);}
  .hchip.pos .v{color:var(--accent);} .hchip.neg .v{color:var(--danger);}
  .hchip .mini{height:6px;width:64px;background:var(--accent-12);border-radius:999px;overflow:hidden;display:inline-block;}
  .hchip .mini i{display:block;height:100%;background:var(--accent);border-radius:999px;}
  .hchip .mini i.warn{background:var(--warn);} .hchip .mini i.over{background:var(--danger);}

  /* Insight */
  .insight{display:flex;align-items:center;gap:10px;border-radius:13px;padding:12px 15px;font-size:14px;font-weight:500;margin-bottom:12px;border:1px solid var(--line);}
  .insight .ico{font-size:15px;}
  .insight.bad{background:var(--danger-12);border-color:transparent;color:var(--danger);}
  .insight.warn{background:var(--warn-14);border-color:transparent;color:var(--warn);}
  .insight.good{background:var(--accent-12);border-color:transparent;color:var(--accent);}
  .insight.neutral{background:var(--card);color:var(--ink-soft);box-shadow:var(--shadow);}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0;}
  .card-title{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-faint);}
  .card-body{padding:14px 18px 18px;}
  .caption{font-size:12.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5;}
  .caption b{color:var(--ink);font-weight:600;}

  /* Add form */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  .chip{appearance:none;border:1px solid var(--line);background:var(--field);color:var(--ink-soft);font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;transition:all .15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-12);}
  .form-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.amount{flex:1 1 130px;} .field.cat{flex:2 1 180px;} .field.date{flex:1 1 140px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .input,.select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;transition:border-color .15s,box-shadow .15s;}
  .input::placeholder{color:var(--ink-faint);}
  .input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-12);}
  .amount-wrap{position:relative;}
  .amount-wrap .peso{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:15px;pointer-events:none;}
  .amount-wrap .input{padding-left:26px;font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}
  .note-row{display:flex;gap:10px;margin-top:10px;align-items:stretch;flex-wrap:wrap;}
  .note-row .field{flex:1 1 220px;}
  .btn-add{flex:0 0 auto;align-self:flex-end;appearance:none;border:0;cursor:pointer;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;padding:11px 22px;border-radius:10px;transition:filter .15s,transform .05s;min-height:44px;}
  .btn-add:hover{filter:brightness(1.07);} .btn-add:active{transform:translateY(1px);}
  .btn-cancel{align-self:flex-end;appearance:none;border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:11px 6px;}
  .inline-add{margin-top:10px;}
  .inline-add .link{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 0;}
  .inline-form{display:none;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;}
  .inline-form.show{display:flex;}
  .inline-form .input{flex:1 1 180px;}
  .btn-mini{appearance:none;border:1px solid var(--accent);background:var(--accent-12);color:var(--accent);font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:9px;cursor:pointer;}

  /* Split + breakdown */
  .split{display:flex;height:11px;border-radius:999px;overflow:hidden;background:var(--field);margin-bottom:10px;}
  .split .seg{height:100%;} .split .seg.fijo{background:var(--ink-soft);} .split .seg.var{background:var(--accent);}
  .split-legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-soft);}
  .split-legend b{color:var(--ink);font-weight:600;}
  .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;}
  .sw.fijo{background:var(--ink-soft);} .sw.var{background:var(--accent);}
  .break-row{padding:11px 0;border-top:1px solid var(--line);} .break-row:first-child{border-top:0;}
  .break-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .break-name{font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;}
  .tag{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;}
  .break-vals{font-size:13px;color:var(--ink-soft);white-space:nowrap;}
  .break-vals .amt{color:var(--ink);font-weight:600;} .break-vals .over{color:var(--danger);font-weight:600;}
  .bar{height:9px;background:var(--accent-12);border-radius:999px;overflow:hidden;}

<body>
  <div class="wrap" id="app"><div class="loading">Cargando tus gastos…</div></div>
  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" style="display:none"></button></div>
  <input type="file" id="fileRestore" accept="application/json,.json">

<script>
(function(){
  "use strict";

  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const ABBR=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const FIJO_DEF=['Renta','Luz/CFE','Suscripciones'];
  const DEFAULT_CATS=['Despensa','Comidas fuera','Gasolina','Luz/CFE','Renta','Suscripciones','Auto','Salud','Entretenimiento','Otros'];
  const KEY='tracker-data';

  const mxn=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
  const money=n=>mxn.format(n||0);
  function shortMoney(n){ n=n||0; if(n>=1000) return '$'+(n/1000).toFixed(n>=9950?0:1).replace(/\.0$/,'')+'k'; return '$'+Math.round(n); }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const pct=n=>Math.round(n)+'%';

  // ---- stats ----
  const sum=a=>a.reduce((s,x)=>s+x,0);
  const mean=a=>a.length?sum(a)/a.length:0;
  function median(a){ if(!a.length)return 0; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
  function stdev(a){ if(a.length<2)return 0; const m=mean(a); return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1)); }
  function linreg(ys){ const n=ys.length,xs=ys.map((_,i)=>i),mx=mean(xs),my=mean(ys); let num=0,den=0; for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;} const slope=den?num/den:0; return {slope,intercept:my-slope*mx,predict:x=>my-slope*mx+slope*x}; }
  function movingAvg(ys,w){ return ys.map((_,i)=> i>=w-1 ? mean(ys.slice(i-w+1,i+1)) : null); }

  // ---- storage: Claude persistent storage when inside Claude; localStorage when running standalone (downloaded / home-screen app); memory as last resort ----
  const mem={};
  const store={
    async get(k){
      if(window.storage){ try{ const r=await window.storage.get(k,false); return r?r.value:null; }catch(e){ return null; } }
      try{ const v=localStorage.getItem(k); return v==null?null:v; }catch(e){ return (k in mem)?mem[k]:null; }
    },
    async set(k,v){
      if(window.storage){ try{ await window.storage.set(k,v,false); return; }catch(e){} }
      try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; }
    }
  };

  // ---- state ----
  let state={ ingresoMensual:null, categorias:[], gastos:[], ingresos:[], financiamientos:[], fuentes:[], cuentas:[], meta:{monto:null,fecha:null}, snapshots:[] };
  let tab='inicio', analysisPeriod='6m';
  let viewY,viewM;
  let editing=null, inlineOpen=false, settingsOpen=false, entryMode='gasto', editingCuenta=null;
  let resetArmed=false,resetTimer=null;
  let lastDeleted=null,toastTimer=null;

  const DEFAULT_FUENTES=['Sueldo','Freelance','Venta','Reembolso','Otro'];
  const TIPOS_CUENTA=['Banco','Efectivo','Inversión','AFORE','Otro'];
  function defaultCats(){ return DEFAULT_CATS.map(n=>({nombre:n,tipo:FIJO_DEF.indexOf(n)>=0?'fijo':'variable',presupuesto:null,topeSemanal:null})); }
  function loadFromObject(d){
    const out={ingresoMensual:null,categorias:[],gastos:[],recurrentes:[],ingresos:[],financiamientos:[],fuentes:DEFAULT_FUENTES.slice(),cuentas:[],meta:{monto:null,fecha:null},snapshots:[]};
    if(d && typeof d.ingresoMensual==='number') out.ingresoMensual=d.ingresoMensual;
    if(d && Array.isArray(d.categorias) && d.categorias.length){
      out.categorias=d.categorias.map(c=> typeof c==='string'
        ? {nombre:c,tipo:FIJO_DEF.indexOf(c)>=0?'fijo':'variable',presupuesto:null,topeSemanal:null}
        : {nombre:String(c.nombre||'Sin nombre'),tipo:(c.tipo==='fijo'?'fijo':'variable'),presupuesto:(typeof c.presupuesto==='number'&&c.presupuesto>0)?c.presupuesto:null,topeSemanal:(typeof c.topeSemanal==='number'&&c.topeSemanal>0)?c.topeSemanal:null});
    } else out.categorias=defaultCats();
    if(d && Array.isArray(d.gastos)){
      out.gastos=d.gastos.filter(g=>g&&typeof g.monto==='number'&&g.fecha).map(g=>({id:g.id||uid(),monto:Math.round(g.monto*100)/100,categoria:String(g.categoria||'Otros'),fecha:String(g.fecha),nota:g.nota?String(g.nota):'',rec:(g.rec!=null?g.rec:null),metodo:(g.metodo?String(g.metodo):null)}));
    }
    if(d && Array.isArray(d.recurrentes)){
      out.recurrentes=d.recurrentes.filter(r=>r&&typeof r.monto==='number'&&r.categoria).map(r=>({id:r.id||uid(),categoria:String(r.categoria),monto:Math.round(r.monto*100)/100,dia:Math.min(28,Math.max(1,parseInt(r.dia)||1)),nota:r.nota?String(r.nota):'',metodo:r.metodo?String(r.metodo):null}));
    }
    if(d && Array.isArray(d.ingresos)){
      out.ingresos=d.ingresos.filter(g=>g&&typeof g.monto==='number'&&g.fecha).map(g=>({id:g.id||uid(),monto:Math.round(g.monto*100)/100,fuente:String(g.fuente||'Otro'),fecha:String(g.fecha),nota:g.nota?String(g.nota):'',rec:(g.rec!=null?g.rec:null)}));
    }
    if(d && Array.isArray(d.financiamientos)){
      out.financiamientos=d.financiamientos.filter(f=>f&&typeof f.montoMensual==='number'&&f.totalMeses&&f.inicio).map(f=>({id:f.id||uid(),descripcion:String(f.descripcion||'Compra a meses'),montoMensual:Math.round(f.montoMensual*100)/100,totalMeses:Math.max(1,parseInt(f.totalMeses)||1),inicio:String(f.inicio),categoria:String(f.categoria||'Otros'),metodo:f.metodo?String(f.metodo):null}));
    }
    if(d && Array.isArray(d.fuentes) && d.fuentes.length) out.fuentes=d.fuentes.map(x=>String(x));
    if(d && Array.isArray(d.cuentas)){
      out.cuentas=d.cuentas.filter(c=>c&&typeof c.saldo==='number'&&c.nombre).map(c=>({id:c.id||uid(),nombre:String(c.nombre),tipo:String(c.tipo||'Otro'),saldo:Math.round(c.saldo*100)/100,nota:c.nota?String(c.nota):'',inst:c.inst?String(c.inst):'',rend:(typeof c.rend==='number'&&c.rend>0)?c.rend:null}));
    }
    if(d && d.meta && typeof d.meta==='object'){ out.meta={monto:(typeof d.meta.monto==='number'&&d.meta.monto>0)?d.meta.monto:null,fecha:(d.meta.fecha?String(d.meta.fecha):null)}; }
    if(d && Array.isArray(d.snapshots)){ out.snapshots=d.snapshots.filter(s=>s&&s.ym&&typeof s.total==='number').map(s=>({ym:String(s.ym),total:Math.round(s.total*100)/100})); }
    out.espera=(d && Array.isArray(d.espera)) ? d.espera.filter(x=>x&&typeof x.monto==='number'&&x.desc).map(x=>({id:x.id||uid(),desc:String(x.desc),monto:Math.round(x.monto*100)/100,categoria:String(x.categoria||'Otros'),creado:(typeof x.creado==='number'?x.creado:Date.now())})) : [];
    out.metodos=(d && Array.isArray(d.metodos)) ? d.metodos.filter(m=>m&&m.nombre).map(m=>({id:String(m.id||uid()),nombre:String(m.nombre),tipo:TIPOS_PAGO[m.tipo]?m.tipo:'credito',saldoInicial:(typeof m.saldoInicial==='number')?m.saldoInicial:0,fechaSaldo:m.fechaSaldo?String(m.fechaSaldo):'',tsSaldo:(typeof m.tsSaldo==='number')?m.tsSaldo:0,diaCorte:(m.diaCorte>=1&&m.diaCorte<=31)?+m.diaCorte:null,diaPago:(m.diaPago>=1&&m.diaPago<=31)?+m.diaPago:null})) : defaultMetodos();
    out.pagos=(d && Array.isArray(d.pagos)) ? d.pagos.filter(p=>p&&typeof p.monto==='number'&&p.fecha).map(p=>({id:p.id||uid(),monto:Math.round(p.monto*100)/100,metodo:String(p.metodo||''),fecha:String(p.fecha),nota:p.nota?String(p.nota):'',cuenta:p.cuenta?String(p.cuenta):null})) : [];
    out.sueldoFrecuencia=(d && (d.sueldoFrecuencia==='quincenal'||d.sueldoFrecuencia==='semanal'))?d.sueldoFrecuencia:'mensual';
    out.sueldoSemanal=(d && typeof d.sueldoSemanal==='number' && d.sueldoSemanal>0)?d.sueldoSemanal:null;
    out.sueldoDia=(d && d.sueldoDia>=0 && d.sueldoDia<=6)?+d.sueldoDia:5;
    out.ahorroSemanal=(d && typeof d.ahorroSemanal==='number' && d.ahorroSemanal>0)?d.ahorroSemanal:null;
    out.ultimoRespaldo=(d && typeof d.ultimoRespaldo==='number')?d.ultimoRespaldo:null;
    out.evitado=(d && d.evitado && typeof d.evitado.monto==='number') ? {monto:Math.round(d.evitado.monto*100)/100,n:parseInt(d.evitado.n)||0} : {monto:0,n:0};
    state=out;
  }
  function persist(){ store.set(KEY,JSON.stringify(state)); }

  // ---- date ----
  function todayYMD(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseYMD(s){ const p=s.split('-'); return {y:+p[0],m:+p[1],d:+p[2]}; }
  function listDate(s){ const p=parseYMD(s); return p.d+' '+ABBR[p.m-1]; }
  function weekday(s){ const p=parseYMD(s); return new Date(p.y,p.m-1,p.d).getDay(); }
  const midx=(y,m)=>y*12+m;
  const fromIdx=i=>({y:Math.floor(i/12),m:((i%12)+12)%12});
  function isCurrent(){ const n=new Date(); return n.getFullYear()===viewY && n.getMonth()===viewM; }
  function totalYM(y,m){ return sum(state.gastos.filter(g=>{const p=parseYMD(g.fecha);return p.y===y&&p.m-1===m;}).map(g=>g.monto)); }
  function monthGastos(){ return state.gastos.filter(g=>{const p=parseYMD(g.fecha);return p.y===viewY&&p.m-1===viewM;}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function catObj(n){ return state.categorias.find(c=>c.nombre===n); }
  function spentIn(name,list){ return list.reduce((s,g)=>g.categoria===name?s+g.monto:s,0); }
  function ingresosYM(y,m){ return state.ingresos.filter(g=>{const p=parseYMD(g.fecha);return p.y===y&&p.m-1===m;}); }
  function totalIngresosYM(y,m){ return sum(ingresosYM(y,m).map(g=>g.monto)); }
  function monthsBetweenYM(ini,y,m){ const p=ini.split('-'); return (y*12+m)-((+p[0])*12+((+p[1])-1)); }
  function finPaymentNo(f,y,m){ return monthsBetweenYM(f.inicio,y,m)+1; }
  function finActive(f,y,m){ const n=finPaymentNo(f,y,m); return n>=1&&n<=f.totalMeses; }
  function finPaid(f){ const n=new Date(); return Math.min(f.totalMeses,Math.max(0,finPaymentNo(f,n.getFullYear(),n.getMonth()))); }
  function finRemaining(f){ return f.montoMensual*(f.totalMeses-finPaid(f)); }
  function finEnd(f){ const p=f.inicio.split('-'); const idx=(+p[0])*12+((+p[1])-1)+(f.totalMeses-1); return {y:Math.floor(idx/12),m:idx%12}; }

  function metodoBreak(list){
    const map={}; let tot=0;
    list.forEach(g=>{ const k=metodoObj(g.metodo)?g.metodo:''; map[k]=(map[k]||0)+g.monto; tot+=g.monto; });
    const keys=Object.keys(map).sort((a,b)=>map[b]-map[a]);
    if(!keys.length||tot<=0) return {html:'<div class="empty">Sin gastos en este periodo.</div>',credito:0,tot:0};
    let credito=0; keys.forEach(k=>{ const m=metodoObj(k); if(m&&m.tipo==='credito') credito+=map[k]; });
    const max=Math.max(...keys.map(k=>map[k]));
    const rows=keys.map(k=>{ const m=metodoObj(k), w=Math.max(3,Math.round(map[k]/max*100));
      return '<div class="break-row"><div class="break-top"><span class="break-name">'+(m?esc(m.nombre)+'<span class="tag">'+TIPOS_PAGO[m.tipo]+'</span>':'<span style="color:var(--ink-faint)">Sin especificar</span>')+'</span>'+
        '<span class="break-vals"><span class="amt num">'+money(map[k])+'</span> · <span class="num">'+Math.round(map[k]/tot*100)+'%</span></span></div>'+
        '<div class="bar"><div class="bar-fill'+(m&&m.tipo==='credito'?' credit':'')+'" data-w="'+w+'"></div></div></div>'; }).join('');

      '<div class="split" style="margin-bottom:8px"><div class="seg credit" style="width:'+cp+'%"></div><div class="seg var" style="width:'+(100-cp)+'%"></div></div>':'';
    let cap='';

    if(map['']===tot) cap='<div class="caption">Elige con qué pagaste al registrar cada gasto (campo <b>Pagado con</b>) y aquí verás cuánto va a cada tarjeta.</div>';
    return {html:head+rows+cap,credito:credito,tot:tot};

  // ============ SUELDO (mensual o quincenal) ============
  function sueldoMensual(){ if(state.sueldoFrecuencia==='semanal') return state.sueldoSemanal>0?state.sueldoSemanal*52/12:0; return state.ingresoMensual>0?state.ingresoMensual:0; }
  function lastDay(y,m){ return new Date(y,m+1,0).getDate(); }
  function sueldoPagos(y,m){
    const s=sueldoMensual(); if(!s) return [];
    const mm=String(m+1).padStart(2,'0'), f=d=>y+'-'+mm+'-'+String(d).padStart(2,'0');
    if(state.sueldoFrecuencia==='semanal'){ const dia=state.sueldoDia==null?5:state.sueldoDia, out=[];
      for(let d=1;d<=lastDay(y,m);d++){ if(new Date(y,m,d).getDay()===dia) out.push({rec:'sueldo-w'+d,monto:state.sueldoSemanal,fecha:f(d),nota:'Pago semanal'}); }
      return out; }
    if(state.sueldoFrecuencia==='quincenal'){ const a=Math.round(s/2*100)/100;
      return [{rec:'sueldo-q1',monto:a,fecha:f(15),nota:'1ª quincena'},{rec:'sueldo-q2',monto:Math.round((s-a)*100)/100,fecha:f(lastDay(y,m)),nota:'2ª quincena'}]; }
    return [{rec:'sueldo',monto:s,fecha:f(1),nota:''}];
  }
  // pagos de sueldo del mes que aún no están registrados
  function sueldoFaltante(y,m){
    const got=new Set(ingresosYM(y,m).filter(g=>g.rec!=null).map(g=>g.rec));
    const ps=sueldoPagos(y,m), mine=new Set(ps.map(p=>p.rec));
    if([...got].some(r=>String(r).indexOf('sueldo')===0&&!mine.has(r))) return []; // cambiaste de esquema este mes: no duplicar
    return ps.filter(p=>!got.has(p.rec));
  }
  // …y que ya debieron haber llegado
  function sueldoVencido(y,m){ const t=todayYMD(); return sueldoFaltante(y,m).filter(p=>p.fecha<=t); }

  // ============ TARJETAS DE CRÉDITO ============
  function creditCards(){ return (state.metodos||[]).filter(m=>m.tipo==='credito'); }
  function ymdIn(y,m,d){ return ymdOf(new Date(y,m,Math.min(d,lastDay(y,m)))); }
  function lastCorteDate(d){ const n=new Date(), y=n.getFullYear(), m=n.getMonth(); if(n.getDate()>=Math.min(d,lastDay(y,m))) return ymdIn(y,m,d); const p=new Date(y,m-1,1); return ymdIn(p.getFullYear(),p.getMonth(),d); }
  function nextDayDate(d){ const n=new Date(), y=n.getFullYear(), m=n.getMonth(); if(n.getDate()<=Math.min(d,lastDay(y,m))) return ymdIn(y,m,d); const q=new Date(y,m+1,1); return ymdIn(q.getFullYear(),q.getMonth(),d); }
  function daysUntil(ymd){ const p=parseYMD(ymd), n=new Date(); return Math.round((new Date(p.y,p.m-1,p.d)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/DAY_MS); }
  // deuda = deuda capturada (si la hay) + compras con la tarjeta después de esa fecha − pagos a la tarjeta
  // los ids nacen de Date.now() en base 36: sirven para saber si algo se capturó después de fijar la deuda
  function idTs(id){ if(typeof id!=='string'||id.length<7) return 0; const n=parseInt(id.slice(0,-5),36); return (n>1.5e12&&n<4e12)?n:0; }
  function tarjetaInfo(m){
    const since=m.fechaSaldo||'', base=m.saldoInicial||0, ts=m.tsSaldo||0;
    const after=x=>x.fecha>since||(since!==''&&x.fecha===since&&idTs(x.id)>ts);
    const g=(lo,hi)=>sum(state.gastos.filter(x=>x.metodo===m.id&&after(x)&&(lo==null||x.fecha>lo)&&(hi==null||x.fecha<=hi)).map(x=>x.monto));
    const p=()=>sum((state.pagos||[]).filter(x=>x.metodo===m.id&&after(x)).map(x=>x.monto));
    const r2=v=>Math.round(v*100)/100;
    const o={deuda:r2(base+g(null,null)-p()),corte:null,alCorte:null,desdeCorte:null,proxPago:null};
    if(m.diaCorte){ o.corte=lastCorteDate(m.diaCorte); o.desdeCorte=r2(g(o.corte,null)); if(since<=o.corte) o.alCorte=Math.max(0,r2(base+g(null,o.corte)-p())); }
    if(m.diaPago) o.proxPago=nextDayDate(m.diaPago);
    return o;
  }
  function deudaTarjetas(){ return sum(creditCards().map(m=>Math.max(0,tarjetaInfo(m).deuda))); }
  function metOpts(sel){ return '<option value="">Sin tarjeta</option>'+(state.metodos||[]).map(m=>'<option value="'+esc(m.id)+'"'+(m.id===sel?' selected':'')+'>'+esc(m.nombre)+'</option>').join(''); }

      '<span class="rec-dia">pago <input class="input num day-in pay-dpago" data-idx="'+i+'" type="number" min="1" max="31" value="'+(m.diaPago||'')+'"></span></div>';

  function pagoBanner(){
    const items=creditCards().map(m=>({m:m,i:tarjetaInfo(m)})).filter(x=>x.i.proxPago&&daysUntil(x.i.proxPago)<=5&&(x.i.alCorte!=null?x.i.alCorte:x.i.deuda)>0);
    return items.map(x=>{ const amt=x.i.alCorte!=null?x.i.alCorte:x.i.deuda, d=daysUntil(x.i.proxPago);

    const mp=(state.pagos||[]).filter(p=>{ const q=parseYMD(p.fecha); return q.y===viewY&&q.m-1===viewM; }).sort((a,b)=>a.fecha<b.fecha?1:-1);
    const pays=mp.length?'<div class="set-label" style="margin:16px 0 2px">Pagos a tarjetas en '+MESES[viewM]+'</div>'+mp.map(p=>'<div class="list-row"><div class="list-main"><div class="list-line1"><span class="pill pay">'+esc(metodoName(p.metodo)||'Tarjeta')+'</span><span class="list-date num">'+listDate(p.fecha)+'</span></div>'+(p.nota?'<div class="list-note">'+esc(p.nota)+'</div>':'')+'</div><span class="list-amt">'+money(p.monto)+'</span><button class="iconbtn edit pago-edit" data-id="'+p.id+'" aria-label="Editar">✎</button><button class="iconbtn pago-del" data-id="'+p.id+'" aria-label="Eliminar">✕</button></div>').join(''):'';

    return sec('tarjetas','Tarjetas de crédito',total>0?'debes '+money(total):'',rows+pays+cap,true);
  }

  // ============ COLCHÓN, DEUDAS Y PATRIMONIO NETO (pestaña Ahorros) ============
  function fondoHTML(total){
    const cuentas=state.cuentas||[]; const liq=sum(cuentas.filter(c=>c.tipo==='Banco'||c.tipo==='Efectivo').map(c=>c.saldo));

    for(let i=1;i<=6&&ex.length<3;i++){ const f=fromIdx(cur-i); const t=totalYM(f.y,f.m); if(t>0) ex.push(t); }
    const avg=ex.length?mean(ex):0;
    const deuda=deudaTarjetas(), msi=sum((state.financiamientos||[]).filter(f=>finPaid(f)<f.totalMeses).map(finRemaining)), deudas=deuda+msi;

  // ============ SEMANA: topes semanales, lista de espera, revisión ============
  const DAY_MS=86400000, ESPERA_MS=48*3600000;
  function ymdOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  // semana de lunes a domingo; offset 0 = esta semana, -1 = la pasada…
  function weekBounds(offset){ const n=new Date(); const dow=(n.getDay()+6)%7; const mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+7*(offset||0)); const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6); return {ini:ymdOf(mon),fin:ymdOf(sun),mon:mon}; }
  function gastosEntre(ini,fin){ return state.gastos.filter(g=>g.fecha>=ini&&g.fecha<=fin); }
  function daysLeftInWeek(){ return 7-((new Date().getDay()+6)%7); }
  function isDiscretionary(g){ const c=catObj(g.categoria); return !(c&&c.tipo==='fijo') && g.rec==null; }
  function weeksOfHistory(beforeYMD,maxW){
    if(!state.gastos.length) return 0;
    const first=state.gastos.reduce((m,g)=>g.fecha<m?g.fecha:m,state.gastos[0].fecha); if(first>=beforeYMD) return 0;
    const p=parseYMD(first),q=parseYMD(beforeYMD); const days=Math.round((new Date(q.y,q.m-1,q.d)-new Date(p.y,p.m-1,p.d))/DAY_MS);
    return Math.max(1,Math.min(maxW,Math.ceil(days/7)));
  }
  // promedio semanal de gasto variable (sin fijos ni programados) en las últimas semanas completas
  function avgWeekly(maxW){
    const w0=weekBounds(0); const nW=weeksOfHistory(w0.ini,maxW); const map={}; let tot=0;
    if(!nW) return {nW:0,map:map,tot:0};
    const finPrev=ymdOf(new Date(w0.mon.getFullYear(),w0.mon.getMonth(),w0.mon.getDate()-1));
    gastosEntre(weekBounds(-nW).ini,finPrev).filter(isDiscretionary).forEach(g=>{ map[g.categoria]=(map[g.categoria]||0)+g.monto; tot+=g.monto; });
    Object.keys(map).forEach(k=>{ map[k]=map[k]/nW; });
    return {nW:nW,map:map,tot:tot/nW};
  }
  const RX_ESENCIAL=/despensa|s[uú]per|abarrot|gasolina|salud|farmacia|m[eé]dic|doctor|auto|transporte|escuela|colegiatura/i;
  function suggestTopes(){ const a=avgWeekly(4); return Object.keys(a.map).filter(k=>catObj(k)&&a.map[k]>=100&&!RX_ESENCIAL.test(k)).sort((x,y)=>a.map[y]-a.map[x]).slice(0,3).map(k=>({cat:k,avg:a.map[k],sug:Math.max(50,Math.round(a.map[k]*0.7/50)*50)})); }
  function applySuggestedTopes(){ const s=suggestTopes(); s.forEach(x=>{ const c=catObj(x.cat); if(c) c.topeSemanal=x.sug; }); persist(); render(); if(s.length) toast('Topes listos. Se reinician cada lunes.'); }
  function capStatus(cat){ const c=catObj(cat); if(!c||!(c.topeSemanal>0)) return null; const w=weekBounds(0); const sp=spentIn(cat,gastosEntre(w.ini,w.fin)); return {cap:c.topeSemanal,sp:sp,ratio:sp/c.topeSemanal,left:c.topeSemanal-sp}; }
  function capToast(cat,fecha){
    const w=weekBounds(0); if(fecha<w.ini||fecha>w.fin) return false; const s=capStatus(cat); if(!s||s.ratio<0.8) return false;
    toast(s.left<0 ? cat+': te pasaste del tope semanal por '+money(-s.left)+'.' : s.left===0 ? cat+': llegaste justo a tu tope de la semana.' : cat+': llevas '+Math.round(s.ratio*100)+'% del tope de la semana. Quedan '+money(s.left)+'.');
    return true;
  }

  function weeklyReviewCard(){
    const w0=weekBounds(0), w1=weekBounds(-1), elapsed=8-daysLeftInWeek();
    const thisW=gastosEntre(w0.ini,w0.fin).filter(isDiscretionary), lastW=gastosEntre(w1.ini,w1.fin).filter(isDiscretionary);
    const a=avgWeekly(4);
    const tThis=sum(thisW.map(g=>g.monto)), tLast=sum(lastW.map(g=>g.monto));
    if(!tThis && !tLast && !a.tot) return '';
    let k='';
    k+=kpi('Esta semana',money(tThis),'día '+elapsed+' de 7');
    k+=kpi('Semana pasada',money(tLast),listDate(w1.ini)+' – '+listDate(w1.fin));
    if(a.nW) k+=kpi('Promedio semanal',money(a.tot),'últimas '+a.nW+(a.nW===1?' semana':' semanas'));
    const mThis={},mLast={}; thisW.forEach(g=>mThis[g.categoria]=(mThis[g.categoria]||0)+g.monto); lastW.forEach(g=>mLast[g.categoria]=(mLast[g.categoria]||0)+g.monto);
    const score=c=>(a.map[c]||0)+(mThis[c]||0)+(mLast[c]||0);
    const cats=[...new Set(Object.keys(mThis).concat(Object.keys(mLast),Object.keys(a.map)))].sort((x,y)=>score(y)-score(x)).slice(0,6);

    let note='';
    if(a.nW && elapsed>=3 && elapsed<7 && tThis>0){ const proj=tThis/elapsed*7;
      note='A este ritmo cerrarías la semana en ~<b>'+money(proj)+'</b>'+(proj>a.tot*1.05?', arriba de tu promedio de '+money(a.tot)+'.':proj<a.tot*0.95?', abajo de tu promedio. Bien.':', en línea con tu promedio.')+' '; }

  // ---------- dinero de la semana ----------
  function fijosMensuales(){
    const n=new Date();
    let f=sum((state.recurrentes||[]).map(r=>r.monto))+sum((state.financiamientos||[]).filter(x=>finActive(x,n.getFullYear(),n.getMonth())).map(x=>x.montoMensual));
    if(f>0) return f;
    const cur=midx(n.getFullYear(),n.getMonth()), arr=[];
    for(let i=1;i<=6&&arr.length<3;i++){ const m=fromIdx(cur-i); const t=sum(state.gastos.filter(g=>{ const p=parseYMD(g.fecha), c=catObj(g.categoria); return p.y===m.y&&p.m-1===m.m&&c&&c.tipo==='fijo'; }).map(g=>g.monto)); if(t>0) arr.push(t); }
    return arr.length?mean(arr):0;
  }
  function semanaDinero(){
    const w=weekBounds(0), left=daysLeftInWeek();
    const ing=state.sueldoFrecuencia==='semanal'?(state.sueldoSemanal>0?state.sueldoSemanal:0):sueldoMensual()*12/52;
    const fijos=fijosMensuales()*12/52, ahorro=state.ahorroSemanal>0?state.ahorroSemanal:0;
    const gastado=sum(gastosEntre(w.ini,w.fin).filter(isDiscretionary).map(g=>g.monto));
    const disp=ing-fijos-ahorro;
    return {ing:ing,fijos:fijos,ahorro:ahorro,gastado:gastado,disp:disp,queda:disp-gastado,left:left};
  }
  function pendientesMes(){
    const n=new Date(), y=n.getFullYear(), m=n.getMonth();
    const loaded=new Set(state.gastos.filter(g=>{ const p=parseYMD(g.fecha); return p.y===y&&p.m-1===m&&g.rec!=null; }).map(g=>g.rec));
    return (state.recurrentes||[]).filter(r=>!loaded.has(r.id)).length+(state.financiamientos||[]).filter(f=>finActive(f,y,m)&&!loaded.has('fin:'+f.id+':'+finPaymentNo(f,y,m))).length+sueldoVencido(y,m).length;
  }
  function movItems(filterFn){
    return [].concat(state.gastos.map(o=>({k:'g',o:o})),state.ingresos.map(o=>({k:'i',o:o})),(state.pagos||[]).map(o=>({k:'p',o:o})))
      .filter(filterFn||(()=>true)).sort((a,b)=>a.o.fecha<b.o.fecha?1:a.o.fecha>b.o.fecha?-1:idTs(b.o.id)-idTs(a.o.id));
  }
  function movRow(it,actions){
    const o=it.o; let pill,amt,cls='',note,search;
    if(it.k==='g'){ pill='<span class="pill">'+esc(o.categoria)+'</span>'; amt='−'+money(o.monto);
      note=[metodoObj(o.metodo)?'<span class="list-pay">'+esc(metodoName(o.metodo))+'</span>':'',o.nota?esc(o.nota):''].filter(Boolean).join(' · ');
      search=o.categoria+' '+(o.nota||'')+' '+metodoName(o.metodo); }
    else if(it.k==='i'){ pill='<span class="pill inc">'+esc(o.fuente)+'</span>'; amt='+'+money(o.monto); cls=' inc'; note=o.nota?esc(o.nota):''; search=o.fuente+' '+(o.nota||'')+' ingreso'; }
    else { pill='<span class="pill pay">Pago '+esc(metodoName(o.metodo)||'tarjeta')+'</span>'; amt=money(o.monto); cls=' pay'; note=[cuentaObj(o.cuenta)?'desde '+esc(cuentaObj(o.cuenta).nombre):'',o.nota?esc(o.nota):''].filter(Boolean).join(' · '); search='pago '+metodoName(o.metodo)+' '+(o.nota||''); }
    return '<div class="list-row mov-row'+(actions?'':' mov-tap')+'" data-k="'+it.k+'" data-id="'+o.id+'" data-search="'+esc(search.toLowerCase())+'"><div class="list-main"><div class="list-line1">'+pill+'<span class="list-date num">'+listDate(o.fecha)+'</span></div>'+(note?'<div class="list-note">'+note+'</div>':'')+'</div><span class="list-amt'+cls+'">'+amt+'</span>'+
      (actions?'<button class="iconbtn edit mov-edit" data-k="'+it.k+'" data-id="'+o.id+'" aria-label="Editar">✎</button><button class="iconbtn del mov-del" data-k="'+it.k+'" data-id="'+o.id+'" aria-label="Eliminar">✕</button>':'')+'</div>';

        '<div class="hero-sub">'+(sd.queda>0&&sd.left>1?'≈ '+money(sd.queda/sd.left)+' por día · ':'')+(sd.left===1?'último día de la semana':'quedan '+sd.left+' días')+'</div>'+

        '<div class="eq"><span>Sueldo <b class="num">'+money(sd.ing)+'</b></span><span>Fijos <b class="num">−'+money(sd.fijos)+'</b></span>'+(sd.ahorro>0?'<span>Ahorro <b class="num">−'+money(sd.ahorro)+'</b></span>':'')+'<span>Gastado <b class="num">−'+money(sd.gastado)+'</b></span></div></div>';

    const capped=state.categorias.filter(c=>c.topeSemanal>0), risk=capped.filter(c=>{ const s=capStatus(c.nombre); return s&&s.ratio>=0.8; }).length;
    const tile=(attr,l,v,s,c)=>'<button class="tile" '+attr+'><div class="tl">'+l+'</div><div class="tv'+(c?' '+c:'')+'">'+v+'</div><div class="ts">'+s+'</div></button>';
    const tiles='<div class="tiles">'+
      tile('data-go="movs"','Gastado en '+MESES[cm],money(mt),pt>0?(mt<=pt?'▼ ':'▲ ')+money(Math.abs(mt-pt))+' vs '+ABBR[prev.m]:'este mes','')+
      tile('data-go="analisis"','Balance del mes',(bal>=0?'+':'−')+money(Math.abs(bal)),incM>0?'ingresos − gastos':'sin ingresos aún',incM>0?(bal>=0?'pos':'neg'):'')+
      tile('data-go="cuentas" data-pg="Tarjetas"','Tarjetas de crédito',money(deuda),dues.length?'pagar antes del '+listDate(dues[0]):(creditCards().length?'deuda total':'sin tarjetas'),deuda>0?'neg':'')+
      tile('data-panel="topes"','Topes semanales',capped.length?(risk?risk+' en riesgo':'En orden'):'Sin topes',capped.length?capped.length+(capped.length===1?' categoría':' categorías'):'toca para ponerlos',risk?'neg':(capped.length?'pos':''))+
      '</div>';
    const nAl=alerts.split('class="recbanner').length-1, rec=movItems().slice(0,nAl>=2?2:3);
    const recent='<div class="card recent"><div class="card-head"><span class="card-title">Últimos movimientos</span><button class="link-btn" data-go="movs">Ver todos</button></div><div class="card-body">'+

    return hero+alerts+tiles+recent;

  function buildInsight(list,total,prevTotal,prevName){
    let over=null,overAmt=0;
    state.categorias.forEach(c=>{ if(c.presupuesto>0){ const sp=spentIn(c.nombre,list); if(sp>c.presupuesto&&(sp-c.presupuesto)>overAmt){over=c.nombre;overAmt=sp-c.presupuesto;} } });
    if(over) return {ico:'⚠',txt:'Te pasaste del presupuesto en '+esc(over)+' por '+money(overAmt)+'.',tone:'bad'};
    if(sueldoMensual()>0&&total>sueldoMensual()) return {ico:'⚠',txt:'Gastaste más de tu ingreso de este mes.',tone:'bad'};
    if(prevTotal>0){ if(total>prevTotal) return {ico:'↑',txt:'Vas '+money(total-prevTotal)+' arriba que en '+prevName+'.',tone:'warn'}; if(total<prevTotal) return {ico:'↓',txt:'Vas '+money(prevTotal-total)+' abajo que en '+prevName+'. Bien.',tone:'good'}; }
    if(list.length){ const map={}; list.forEach(g=>map[g.categoria]=(map[g.categoria]||0)+g.monto); let top=null,tv=0; Object.keys(map).forEach(k=>{if(map[k]>tv){tv=map[k];top=k;}}); return {ico:'◆',txt:'Tu mayor gasto es '+esc(top)+' ('+Math.round(tv/total*100)+'% del total).',tone:'neutral'}; }
    return null;
  }

  function analisisHTML(){
    const periodSel='<div class="ctrl-row"><div class="pwrap"><span>Periodo</span><select class="pselect" id="pselect">'+
      ['mes','3m','6m','ano','todo'].map(p=>'<option value="'+p+'"'+(p===analysisPeriod?' selected':'')+'>'+PERIOD_LABEL[p]+'</option>').join('')+'</select></div></div>';

    if(!state.gastos.length){
      return '<div class="card"><div class="card-body"><div class="empty">Aún no hay datos que analizar.<br>Registra algunos gastos con el botón <b>+</b> y aquí verás tus tendencias, Pareto, estadística y más.</div></div></div>';
    }

    const idxs=periodIdxs(), idxSet=new Set(idxs);
    const pGastos=state.gastos.filter(g=>{const p=parseYMD(g.fecha);return idxSet.has(midx(p.y,p.m-1));});
    const pTotal=sum(pGastos.map(g=>g.monto));
    const nMonths=idxs.length;

    // monthly totals within period (for high/low + savings + adherence)
    const monthTotals=idxs.map(i=>{const f=fromIdx(i);return {i,y:f.y,m:f.m,total:totalYM(f.y,f.m)};});
    const withData=monthTotals.filter(x=>x.total>0);
    const hi=withData.reduce((a,b)=>b.total>a.total?b:a,withData[0]||{total:0});
    const lo=withData.reduce((a,b)=>b.total<a.total?b:a,withData[0]||{total:0});

    // KPIs
    let kpis='';
    kpis+=kpi('Total del periodo',money(pTotal),PERIOD_LABEL[analysisPeriod]);
    const nWith=withData.length; kpis+=kpi('Promedio mensual',money(nWith?pTotal/nWith:0),(nWith||0)+(nWith===1?' mes con registro':' meses con registro'));
    if(withData.length){ kpis+=kpi('Mes más alto',money(hi.total),MESES[hi.m]+' '+(''+hi.y).slice(2)); kpis+=kpi('Mes más bajo',money(lo.total),MESES[lo.m]+' '+(''+lo.y).slice(2)); }
    const monthInc=i=>{const f=fromIdx(i);const r=totalIngresosYM(f.y,f.m);return r>0?r:sueldoMensual();};
    const incMonths=withData.filter(x=>monthInc(x.i)>0);
    if(incMonths.length){
      const rates=incMonths.map(x=>{const inc=monthInc(x.i);return (inc-x.total)/inc*100;});
      const avg=mean(rates); kpis+=kpi('Tasa de ahorro prom.',Math.round(avg)+'%','ingresos vs gastos',avg>=0?'pos':'neg');
    }
    const overall=state.categorias.reduce((s,c)=>s+(c.presupuesto>0?c.presupuesto:0),0);
    if(overall>0 && withData.length){ const ok=withData.filter(x=>x.total<=overall).length; kpis+=kpi('Dentro de presupuesto',Math.round(ok/withData.length*100)+'%',ok+' de '+withData.length+' meses'); }
    const kpisHtml='<div class="kpis">'+kpis+'</div>';
    const pIngresos=sum(state.ingresos.filter(g=>{const p=parseYMD(g.fecha);return idxSet.has(midx(p.y,p.m-1));}).map(g=>g.monto));
    const balPer=pIngresos-pTotal;
    const finsLiveA=(state.financiamientos||[]).filter(f=>finPaid(f)<f.totalMeses);
    const compMensualA=finsLiveA.reduce((s,f)=>s+f.montoMensual,0), compSaldoA=finsLiveA.reduce((s,f)=>s+finRemaining(f),0);
    let finK='';
    finK+=kpi('Ingresos',money(pIngresos),PERIOD_LABEL[analysisPeriod],pIngresos>0?'pos':'');
    finK+=kpi('Gastos',money(pTotal),PERIOD_LABEL[analysisPeriod]);
    finK+=kpi('Balance',(balPer>=0?'+':'')+money(balPer),balPer>=0?'ahorro':'déficit',balPer>=0?'pos':'neg');
    if(pIngresos>0) finK+=kpi('Tasa de ahorro',Math.round(balPer/pIngresos*100)+'%','del periodo',balPer>=0?'pos':'neg');
    const pPagos=sum((state.pagos||[]).filter(p=>{const q=parseYMD(p.fecha);return idxSet.has(midx(q.y,q.m-1));}).map(p=>p.monto)); if(pPagos>0) finK+=kpi('Pagos a tarjetas',money(pPagos),'no cuentan como gasto');
    const dT=deudaTarjetas(); if(dT>0) finK+=kpi('Deuda en tarjetas',money(dT),'hoy','neg');
    if(finsLiveA.length) finK+=kpi('Mensualidades activas',money(compMensualA)+'/mes','saldo '+money(compSaldoA),'neg');
    const finCard=(pIngresos>0||finsLiveA.length||pPagos>0||dT>0)?'<div class="card"><div class="card-head"><span class="card-title">Resumen financiero</span></div><div class="card-body"><div class="kpis" style="margin-bottom:0">'+finK+'</div></div></div>':'';

    // 12-month trend + MA3 (independent of period)
    const now=new Date(),cur=midx(now.getFullYear(),now.getMonth()); const tm=[];
    for(let i=11;i>=0;i--){const f=fromIdx(cur-i);tm.push({y:f.y,m:f.m,total:totalYM(f.y,f.m)});}

    const pg=(html,t)=>html?{title:t,html:html}:null;

      pg(kpisHtml+finCard,'Resumen'), pg(weeklyReviewCard(),'Semana'),
      mbA.tot>0?pg(sec('a-metodo','Por tarjeta',mbA.credito>0?'crédito '+money(mbA.credito):'',mbA.html,true),'Tarjetas'):null,
      pg(comidaCard(),'Comida'), pg(trendCard,'Tendencia'), pg(fcCard,'Proyección'), pg(paretoCard,'Pareto'),
      pg(statsCard,'Estadística'), pg(wkCard,'Por día'), pg(anomCard,'Atípicos'), pg(heatCard,'Calendario')]);
  }

  function proyeccionCard(){

    for(let i=1;i<=6;i++){ const f=fromIdx(cur-i); const e=totalYM(f.y,f.m); if(e>0) exps.push(e); }
    const avgExp=exps.length?mean(exps):0;
    if(start<=0 && inc<=0 && avgExp<=0) return '';
    const curMSI=(state.financiamientos||[]).filter(f=>finActive(f,now.getFullYear(),now.getMonth())).reduce((s,f)=>s+f.montoMensual,0);
    let bal=start; const series=[{lab:'hoy',val:start}]; let netSum=0,nNet=0;
    for(let i=1;i<=12;i++){ const f=fromIdx(cur+i);
      const activeMSI=(state.financiamientos||[]).filter(ff=>finActive(ff,f.y,f.m)).reduce((s,ff)=>s+ff.montoMensual,0);
      const exp=Math.max(0,avgExp-Math.max(0,curMSI-activeMSI));
      const net=inc-exp; bal+=net; netSum+=net; nNet++; series.push({lab:ABBR[f.m],val:bal});
    }
    const b6=series[6].val, b12=series[12].val, avgNet=nNet?netSum/nNet:0;
    const events=[];

  function trendChart(tm){
    const totals=tm.map(x=>x.total), max=Math.max(1,...totals), ma=movingAvg(totals,3);
    const curIdx=11;
    const bars=tm.map((x,i)=>{ const h=x.total<=0?0:Math.max(2,Math.round(x.total/max*100));
      return '<div class="bcol'+(i===curIdx?' cur':'')+'" title="'+esc(MESES[x.m])+' '+x.y+': '+money(x.total)+'"><div class="b" data-h="'+h+'"></div></div>'; }).join('');
    const pts=[]; ma.forEach((v,i)=>{ if(v!=null){ const x=((i+0.5)/12*100).toFixed(2); const y=(100-(v/max*100)).toFixed(2); pts.push(x+','+y); } });
    const line=pts.length>1?'<svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline class="ma" vector-effect="non-scaling-stroke" points="'+pts.join(' ')+'"/></svg>':'';
    const labels=tm.map((x,i)=>'<span class="'+(i===curIdx?'cur':'')+'">'+esc(ABBR[x.m])+'</span>').join('');
    const recent3=mean(totals.slice(-3)), prev3=mean(totals.slice(-6,-3));
    let trendNote=''; if(prev3>0){ const diff=recent3-prev3; trendNote = diff>0 ? 'Tu gasto promedio va <b>al alza</b> ('+money(Math.abs(diff))+'/mes vs el trimestre previo).' : diff<0 ? 'Tu gasto promedio va <b>a la baja</b> ('+money(Math.abs(diff))+'/mes menos que el trimestre previo).' : 'Tu gasto promedio se mantiene estable.'; }
    return '<div class="card"><div class="card-head"><span class="card-title">Tendencia · 12 meses</span></div><div class="card-body">'+
      '<div class="chart-stack"><div class="bars-track">'+bars+'</div>'+line+'</div><div class="xlabels">'+labels+'</div>'+
      '<div class="legend"><span><span class="bk"></span>gasto mensual</span><span><span class="ln"></span>promedio móvil 3m</span></div>'+
      (trendNote?'<div class="caption">'+trendNote+'</div>':'')+'</div></div>';
  }

  function forecastCard(tm,cur){
    const now=new Date(); const cy=now.getFullYear(),cm=now.getMonth(),today=now.getDate(),dim=new Date(cy,cm+1,0).getDate();
    const curTotal=totalYM(cy,cm);
    // complete months = exclude current month, take last up to 6 with any history
    const complete=tm.slice(0,11).map(x=>x.total);
    // trim leading zero months (before first data) for a cleaner fit
    let firstData=complete.findIndex(t=>t>0); if(firstData<0) firstData=complete.length;
    const series=complete.slice(firstData).slice(-6);
    let projHtml='', fcHtml='';
    if(curTotal>0 && today<dim){
      const mg=state.gastos.filter(g=>{const p=parseYMD(g.fecha);return p.y===cy&&p.m-1===cm;});
      let fij=0,vari=0; mg.forEach(g=>{ const c=catObj(g.categoria); if(c&&c.tipo==='fijo') fij+=g.monto; else vari+=g.monto; });
      const proj=fij + (today>0?vari/today*dim:0);
      projHtml=kpi('Proyección a fin de mes',money(proj),'fijos + ritmo variable ('+today+'/'+dim+' días)');
    }
    else if(curTotal>0){ projHtml=kpi('Total del mes',money(curTotal),MESES[cm]); }
    if(series.length>=2){ const reg=linreg(series); const f=Math.max(0,reg.predict(series.length)); const dir=reg.slope>5?'↑':reg.slope<-5?'↓':'→';
      fcHtml=kpi('Pronóstico próximo mes',money(f),'regresión lineal '+dir,reg.slope>5?'neg':(reg.slope<-5?'pos':'')); }
    else fcHtml=kpi('Pronóstico próximo mes','—','necesitas ≥2 meses completos');
    const note='<div class="caption">La <b>proyección</b> toma tus gastos <b>fijos ya registrados</b> y extrapola solo el <b>gasto variable</b> al ritmo del mes (así la renta no infla el cálculo a inicio de mes). El <b>pronóstico</b> ajusta una recta de mínimos cuadrados a tus meses cerrados — es un estimado, no una certeza.</div>';
    return '<div class="card"><div class="card-head"><span class="card-title">Proyección y pronóstico</span></div><div class="card-body"><div class="kpis" style="margin-bottom:0">'+projHtml+fcHtml+'</div>'+note+'</div></div>';
  }

  function paretoChart(pGastos,pTotal){
    const map={}; pGastos.forEach(g=>map[g.categoria]=(map[g.categoria]||0)+g.monto);
    const rows=Object.keys(map).map(k=>({c:k,v:map[k]})).sort((a,b)=>b.v-a.v);
    if(!rows.length) return '';
    const maxV=rows[0].v; let cum=0; const data=rows.map(r=>{cum+=r.v;return {c:r.c,v:r.v,cumPct:pTotal>0?cum/pTotal*100:0};});
    let n80=0,reached=false; data.forEach(d=>{ if(!reached){n80++;if(d.cumPct>=80)reached=true;} });
    const bars=data.map(d=>{ const h=Math.max(2,Math.round(d.v/maxV*100)); return '<div class="bcol" title="'+esc(d.c)+': '+money(d.v)+' ('+pct(d.cumPct)+' acum.)"><div class="b" data-h="'+h+'"></div></div>'; }).join('');
    const pts=data.map((d,i)=>((i+0.5)/data.length*100).toFixed(2)+','+(100-d.cumPct).toFixed(2)).join(' ');
    const dots=data.map((d,i)=>'<circle class="dot" cx="'+((i+0.5)/data.length*100).toFixed(2)+'" cy="'+(100-d.cumPct).toFixed(2)+'" r="1.6" vector-effect="non-scaling-stroke"/>').join('');
    const line='<svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"><line class="guide" x1="0" y1="20" x2="100" y2="20" vector-effect="non-scaling-stroke"/><polyline class="cum" vector-effect="non-scaling-stroke" points="'+pts+'"/>'+dots+'</svg>';
    const labels=data.map(d=>'<span title="'+esc(d.c)+'">'+esc(d.c)+'</span>').join('');
    const listRows=data.map((d,i)=>'<div class="prow'+(i<n80?' in80':'')+'"><span class="pc">'+esc(d.c)+'</span><span class="pv num">'+money(d.v)+'</span><span class="pp num">'+pct(d.cumPct)+'</span></div>').join('');
    return '<div class="card"><div class="card-head"><span class="card-title">Pareto · 80/20</span></div><div class="card-body">'+
      '<div class="chart-stack"><div class="bars-track">'+bars+'</div>'+line+'</div><div class="xlabels">'+labels+'</div>'+
      '<div class="legend"><span><span class="bk"></span>gasto</span><span><span class="ln cum"></span>% acumulado</span><span style="color:var(--ink-faint)">– – línea 80%</span></div>'+
      '<div class="caption"><b>'+n80+(n80===1?' categoría concentra':' categorías concentran')+' el 80%</b> de tu gasto. Ahí está el mayor apalancamiento si quieres recortar.</div>'+
      '<div style="margin-top:8px">'+listRows+'</div></div></div>';
  }

  function lastNMonthTotalsForCat(cat,nM){
    const now=new Date(),cur=midx(now.getFullYear(),now.getMonth()); const out=[];
    for(let i=nM-1;i>=0;i--){ const f=fromIdx(cur-i); out.push(sum(state.gastos.filter(g=>{const p=parseYMD(g.fecha);return g.categoria===cat&&p.y===f.y&&p.m-1===f.m;}).map(g=>g.monto))); }
    return out;
  }
  function sparkline(vals){
    const max=Math.max(1,...vals); const n=vals.length;
    const pts=vals.map((v,i)=>(n<2?0:(i/(n-1)*68+2)).toFixed(1)+','+(20-(v/max*16)).toFixed(1));
    const last=pts.length?pts[pts.length-1].split(','):null;
    return '<svg class="spark" width="72" height="22" viewBox="0 0 72 22">'+
      (n>1?'<polyline class="spark-line" vector-effect="non-scaling-stroke" points="'+pts.join(' ')+'"/>':'')+
      (last?'<circle class="spark-dot" cx="'+last[0]+'" cy="'+last[1]+'" r="2"/>':'')+'</svg>';
  }
  function statsTable(pGastos,cur){
    const cats=[...new Set(pGastos.map(g=>g.categoria))];
    const rows=cats.map(c=>{ const amts=pGastos.filter(g=>g.categoria===c).map(g=>g.monto); const m=mean(amts),sd=stdev(amts),cv=m?sd/m*100:0;
      return {c,n:amts.length,tot:sum(amts),m,med:median(amts),sd,cv,max:Math.max(...amts)}; }).sort((a,b)=>b.tot-a.tot);
    const body=rows.map(r=>{ const cvcls=r.n<2?'':(r.cv>=60?'hi':r.cv>=25?'mid':'lo');
      return '<tr><td>'+esc(r.c)+'</td><td class="colspark">'+sparkline(lastNMonthTotalsForCat(r.c,6))+'</td><td>'+r.n+'</td><td>'+money(r.tot)+'</td><td>'+money(r.m)+'</td><td>'+money(r.med)+'</td><td>'+money(r.sd)+'</td><td class="cvtag '+cvcls+'">'+(r.n<2?'—':pct(r.cv))+'</td></tr>'; }).join('');
    return '<div class="card"><div class="card-head"><span class="card-title">Estadística por categoría</span></div><div class="card-body"><div class="tbl-wrap"><table class="stats">'+
      '<thead><tr><th>Categoría</th><th>6m</th><th>n</th><th>Total</th><th>Media</th><th>Mediana</th><th>σ</th><th>CV</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
      '<div class="caption">El <b>coeficiente de variación (CV = σ/media)</b> mide qué tan errático es cada gasto: <span class="cvtag lo">verde</span> = estable, <span class="cvtag mid">ámbar</span> = moderado, <span class="cvtag hi">rojo</span> = muy variable. Los fijos deberían tener CV bajo; un variable con CV alto es donde más puedes mover la aguja.</div></div></div>';
  }

  function weekdayChart(pGastos){
    const vis=pGastos.filter(g=>{const c=catObj(g.categoria);return !(c&&c.tipo==='fijo');});
    const wd=[0,0,0,0,0,0,0]; vis.forEach(g=>wd[weekday(g.fecha)]+=g.monto);
    const totalV=sum(wd); if(totalV<=0) return '';
    const max=Math.max(1,...wd);
    const bars=wd.map((v,i)=>{ const h=v<=0?0:Math.max(2,Math.round(v/max*100)); const wknd=(i===0||i===6);
      return '<div class="bcol" title="'+DOW[i]+': '+money(v)+'"><div class="b'+(wknd?' wknd':'')+'" data-h="'+h+'"></div></div>'; }).join('');
    const labels=DOW.map(d=>'<span>'+d+'</span>').join('');
    const weekend=wd[0]+wd[6]; const wkShare=Math.round(weekend/totalV*100);
    const top=wd.indexOf(max);
    return '<div class="card"><div class="card-head"><span class="card-title">Patrón por día · gasto variable</span></div><div class="card-body">'+
      '<div class="bars-track">'+bars+'</div><div class="xlabels">'+labels+'</div>'+
      '<div class="caption">Tu día de mayor gasto variable es <b>'+DOW[top]+'</b>. El <b>'+wkShare+'%</b> de tu gasto variable cae en fin de semana (sábado y domingo). Se excluyen los fijos porque dependen del calendario, no de tu comportamiento.</div></div></div>';
  }

  function anomaliesCard(pGastos){
    const cats=[...new Set(pGastos.map(g=>g.categoria))]; let flags=[];
    cats.forEach(c=>{ const arr=pGastos.filter(g=>g.categoria===c); const amts=arr.map(g=>g.monto); if(amts.length<4) return;
      const m=mean(amts),sd=stdev(amts); if(sd<=0) return; const floor=Math.max(150,m*0.4);
      arr.forEach(g=>{ const z=(g.monto-m)/sd; if(z>=2 && (g.monto-m)>=floor) flags.push({g,z,m}); }); });
    flags.sort((a,b)=>b.z-a.z); flags=flags.slice(0,8);
    let body;
    if(!flags.length) body='<div class="empty">Sin movimientos atípicos en este periodo. Tu gasto es consistente.</div>';
    else body=flags.map(f=>'<div class="an-row"><div class="an-main"><div class="ttl">'+esc(f.g.categoria)+(f.g.nota?' · '+esc(f.g.nota):'')+'</div><div class="sub">'+listDate(f.g.fecha)+' · media de la categoría '+money(f.m)+'</div></div><span class="an-z">'+f.z.toFixed(1)+'σ</span><span class="an-amt">'+money(f.g.monto)+'</span></div>').join('');
    return '<div class="card"><div class="card-head"><span class="card-title">Movimientos atípicos</span></div><div class="card-body">'+body+
      (flags.length?'<div class="caption">Marcados los gastos que superan <b>la media + 2σ</b> de su categoría (y con desviación material). Son los que más distorsionan tu mes — vale la pena revisar si fueron puntuales o si se están volviendo costumbre.</div>':'')+'</div></div>';
  }

  function heatmapCard(){
    const now=new Date(),y=now.getFullYear(),m=now.getMonth(),dim=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();
    const daily={}; state.gastos.forEach(g=>{const p=parseYMD(g.fecha);if(p.y===y&&p.m-1===m)daily[p.d]=(daily[p.d]||0)+g.monto;});
    const max=Math.max(1,...Object.values(daily).concat([0]));
    let cells=''; for(let i=0;i<first;i++) cells+='<div class="cell empty"></div>';
    for(let d=1;d<=dim;d++){ const v=daily[d]||0; if(v>0){ const op=(0.18+0.82*v/max).toFixed(2); cells+='<div class="cell has" style="background:var(--accent);opacity:'+op+'" title="'+d+' '+ABBR[m]+': '+money(v)+'">'+d+'</div>'; } else cells+='<div class="cell" title="'+d+' '+ABBR[m]+': sin gasto">'+d+'</div>'; }
    const head=['D','L','M','M','J','V','S'].map(x=>'<span>'+x+'</span>').join('');
    const daysWith=Object.keys(daily).length; const top=Object.keys(daily).sort((a,b)=>daily[b]-daily[a])[0];

      '<div class="heat-head">'+head+'</div><div class="heat">'+cells+'</div>'+
      '<div class="caption">'+(daysWith?'Registraste gasto en <b>'+daysWith+'</b> de '+dim+' días'+(top?'; el más alto fue el día <b>'+top+'</b> ('+money(daily[top])+').':'.'):'Aún no hay gastos este mes.')+'</div></div></div>';
  }

  function readForm(){ return { monto:parseFloat(document.getElementById('fMonto').value), concepto:document.getElementById('fCat').value, fecha:document.getElementById('fFecha').value||todayYMD(), nota:document.getElementById('fNota').value.trim(), metodo:(document.getElementById('fMetodo')?document.getElementById('fMetodo').value:'')||null, cuenta:(document.getElementById('fCuenta')?document.getElementById('fCuenta').value:'')||null }; }
  function saveEntry(){
    const mEl=document.getElementById('fMonto'); const f=readForm();
    if(!(f.monto>0)){ mEl.focus(); mEl.style.borderColor='var(--danger)'; mEl.style.boxShadow='0 0 0 3px var(--danger-12)'; return; }
    f.monto=Math.round(f.monto*100)/100; let capCheck=false;
    const isInc = editing? editing.flow==='ingreso' : entryMode==='ingreso';
    const isPagoNew=!editing&&entryMode==='pago'; let pagoDone=null, pagoCuenta=null; const wasEdit=!!editing;
    if(isPagoNew&&!f.concepto){ toast('Primero agrega una tarjeta de crédito en Ajustes'); return; }
    if(editing){
      if(editing.flow==='pago'){ const p=state.pagos.find(x=>x.id===editing.id); if(p){ cuentaAjuste(p.cuenta,p.monto); p.monto=f.monto;p.metodo=f.concepto;p.fecha=f.fecha;p.nota=f.nota;p.cuenta=f.cuenta; pagoCuenta=cuentaAjuste(f.cuenta,-f.monto); recordSnapshot(); } }
      else if(editing.flow==='ingreso'){ const g=state.ingresos.find(x=>x.id===editing.id); if(g){g.monto=f.monto;g.fuente=f.concepto;g.fecha=f.fecha;g.nota=f.nota;} }
      else { const g=state.gastos.find(x=>x.id===editing.id); if(g){g.monto=f.monto;g.categoria=f.concepto;g.fecha=f.fecha;g.nota=f.nota;g.metodo=f.metodo;} }
      editing=null;
    } else if(isPagoNew){ state.pagos.push({id:uid(),monto:f.monto,metodo:f.concepto,fecha:f.fecha,nota:f.nota,cuenta:f.cuenta}); pagoDone=f.concepto; pagoCuenta=cuentaAjuste(f.cuenta,-f.monto); if(pagoCuenta) recordSnapshot(); }
    else if(isInc){ state.ingresos.push({id:uid(),monto:f.monto,fuente:f.concepto,fecha:f.fecha,nota:f.nota,rec:null}); }
    else { state.gastos.push({id:uid(),monto:f.monto,categoria:f.concepto,fecha:f.fecha,nota:f.nota,metodo:f.metodo}); capCheck=true; }
    persist(); const p=parseYMD(f.fecha); viewY=p.y; viewM=p.m-1; inlineOpen=false; sheetOpen=false; editing=null; render();
    let shown=false;
    if(capCheck) shown=capToast(f.concepto,f.fecha);
    if(pagoDone){ const m=metodoObj(pagoDone); if(m){ const ti=tarjetaInfo(m); toast('Pago registrado. '+(ti.deuda>0?'Aún debes '+money(ti.deuda)+' en '+m.nombre+'.':m.nombre+' queda en ceros.')+(pagoCuenta?' '+pagoCuenta.nombre+' queda en '+money(pagoCuenta.saldo)+'.':'')); shown=true; } }
    if(!shown) toast(wasEdit?'Cambios guardados':(isInc?'Ingreso registrado':'Gasto registrado'));
  }

  function loadRecurring(){
    const mg=monthGastos(); const loaded=new Set(mg.filter(g=>g.rec!=null).map(g=>g.rec));
    const dim=new Date(viewY,viewM+1,0).getDate(); const mm=String(viewM+1).padStart(2,'0'); let n=0;
    (state.recurrentes||[]).filter(r=>!loaded.has(r.id)).forEach(r=>{ const day=Math.min(Math.max(1,r.dia||1),dim);
      state.gastos.push({id:uid(),monto:r.monto,categoria:r.categoria,fecha:viewY+'-'+mm+'-'+String(day).padStart(2,'0'),nota:r.nota||'',rec:r.id,metodo:r.metodo||null}); n++; });
    (state.financiamientos||[]).forEach(f=>{ if(finActive(f,viewY,viewM)){ const pn=finPaymentNo(f,viewY,viewM); const tag='fin:'+f.id+':'+pn;
      if(!loaded.has(tag)){ state.gastos.push({id:uid(),monto:f.montoMensual,categoria:f.categoria,fecha:viewY+'-'+mm+'-01',nota:f.descripcion+' ('+pn+'/'+f.totalMeses+')',rec:tag,metodo:f.metodo||null}); n++; } } });
    sueldoVencido(viewY,viewM).forEach(p=>{ state.ingresos.push({id:uid(),monto:p.monto,fuente:'Sueldo',fecha:p.fecha,nota:p.nota,rec:p.rec}); n++; });
    if(n){ persist(); render(); toast(n+' movimiento'+(n>1?'s':'')+' agregado'+(n>1?'s':'')); }
  }

  function filterMovs(){
    const q=(document.getElementById('fSearch').value||'').trim().toLowerCase();
    let shown=0; document.querySelectorAll('.mov-row').forEach(r=>{ const m=!q||(r.getAttribute('data-search')||'').includes(q); r.style.display=m?'':'none'; if(m)shown++; });
    const se=document.getElementById('searchEmpty'); if(se) se.style.display=(q&&shown===0)?'':'none';
  }
  function delEntry(id){ const idx=state.gastos.findIndex(g=>g.id===id); if(idx<0)return; lastDeleted={item:state.gastos[idx],idx}; state.gastos.splice(idx,1); persist(); render();
    toast('Movimiento eliminado',{label:'Deshacer',fn:()=>{ if(lastDeleted){ state.gastos.splice(Math.min(lastDeleted.idx,state.gastos.length),0,lastDeleted.item); persist(); lastDeleted=null; render(); } }}); }
  function toast(msg,action){ const t=document.getElementById('toast'),b=document.getElementById('toastAct'); document.getElementById('toastMsg').textContent=msg;
    if(action){ b.style.display=''; b.textContent=action.label; b.onclick=()=>{ action.fn(); t.classList.remove('show'); clearTimeout(toastTimer); }; } else b.style.display='none';
    t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.classList.remove('show'); lastDeleted=null; },5000); }
  function disarmReset(){ resetArmed=false; clearTimeout(resetTimer); }
  function handleReset(){ if(!resetArmed){ resetArmed=true; render(); resetTimer=setTimeout(()=>{ resetArmed=false; render(); },4000); return; } disarmReset(); state={ingresoMensual:null,categorias:defaultCats(),gastos:[],recurrentes:[],ingresos:[],financiamientos:[],fuentes:DEFAULT_FUENTES.slice(),cuentas:[],meta:{monto:null,fecha:null},snapshots:[],espera:[],evitado:{monto:0,n:0},metodos:defaultMetodos(),pagos:[],sueldoFrecuencia:'mensual'}; editing=null; editingCuenta=null; settingsOpen=false; inlineOpen=false; const n=new Date(); viewY=n.getFullYear(); viewM=n.getMonth(); recordSnapshot(); render(); }
  function download(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
  function exportCSV(){ const cell=v=>{ v=String(v==null?'':v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const rows=[['Fecha','Categoria','Tipo','Monto','Nota','Pagado con','Tipo de pago']]; state.gastos.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(g=>{ const c=catObj(g.categoria); const mo=metodoObj(g.metodo); rows.push([g.fecha,g.categoria,c?c.tipo:'',g.monto.toFixed(2),g.nota||'',mo?mo.nombre:'',mo?TIPOS_PAGO[mo.tipo]:'']); });
    download(new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),'mis-gastos.csv'); }
  function backup(){ state.ultimoRespaldo=Date.now(); persist(); download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'respaldo-gastos-'+todayYMD()+'.json'); }

  document.getElementById('fileRestore').addEventListener('change',function(e){ const file=e.target.files[0]; if(!file)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d&&Array.isArray(d.gastos)){ loadFromObject(d); recordSnapshot(); render(); toast('Datos restaurados'); } else toast('El archivo no tiene el formato esperado'); }catch(err){ toast('No se pudo leer el archivo'); } };
    r.readAsText(file); e.target.value=''; });

  async function init(){
    const raw=await store.get(KEY);
    if(raw){ try{ loadFromObject(JSON.parse(raw)); }catch(e){ state={ingresoMensual:null,categorias:defaultCats(),gastos:[],recurrentes:[],ingresos:[],financiamientos:[],fuentes:DEFAULT_FUENTES.slice(),cuentas:[],meta:{monto:null,fecha:null},snapshots:[]}; } }
    else { state={ingresoMensual:null,categorias:defaultCats(),gastos:[],recurrentes:[],ingresos:[],financiamientos:[],fuentes:DEFAULT_FUENTES.slice(),cuentas:[],meta:{monto:null,fecha:null},snapshots:[]}; persist(); }
    if(!state.categorias.length) state.categorias=defaultCats();
    if(!Array.isArray(state.recurrentes)) state.recurrentes=[];
    if(!Array.isArray(state.ingresos)) state.ingresos=[];
    if(!Array.isArray(state.financiamientos)) state.financiamientos=[];
    if(!Array.isArray(state.fuentes)||!state.fuentes.length) state.fuentes=DEFAULT_FUENTES.slice();
    if(!Array.isArray(state.cuentas)) state.cuentas=[];
    if(!state.meta||typeof state.meta!=='object') state.meta={monto:null,fecha:null};
    if(!Array.isArray(state.snapshots)) state.snapshots=[];
    if(!Array.isArray(state.espera)) state.espera=[];
    if(!Array.isArray(state.metodos)) state.metodos=defaultMetodos();
    if(!Array.isArray(state.pagos)) state.pagos=[];
    if(!state.evitado||typeof state.evitado.monto!=='number') state.evitado={monto:0,n:0};
    const now=new Date(); viewY=now.getFullYear(); viewM=now.getMonth();
    recordSnapshot();
    render();
  }
  init();
})();
</script>

  // App instalable y sin conexión (solo cuando se sirve por https, p. ej. GitHub Pages)
  if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
